name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "1785340800"
      VERSION: "0.01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install NDK r29
        run: sdkmanager "ndk;29.0.14206865"
      - name: Build and verify
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: sh ./scripts/build-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZCR521-Android-AI-MCP-v0.01
          path: dist/
          if-no-files-found: error
